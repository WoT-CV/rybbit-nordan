# Include inside the dedicated tracking.wot-cv.com server block, replacing its
# previous script/replay location. Keep private API no-store rules unchanged.
# Native backend Cache-Control passes through: script 1h, replay/metrics 1d.
location ~ ^/api/(script\.js|replay\.js|metrics\.js)$ {
    gzip on;
    gzip_types application/javascript text/javascript;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    proxy_pass http://127.0.0.1:13001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noimageindex" always;
}
