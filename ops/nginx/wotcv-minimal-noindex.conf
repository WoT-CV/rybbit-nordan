# server{} context ONLY, inside the dedicated WoT-CV minimal vhost.
# Do not include globally or in an existing shared vhost.
include /etc/nginx/snippets/wotcv-minimal-noindex-headers.conf;

location = /robots.txt {
    # Cache-Control below replaces inherited add_header declarations.
    include /etc/nginx/snippets/wotcv-minimal-noindex-headers.conf;
    types { }
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    set $wotcv_minimal_empty_manifest "";
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    # A variable-valued empty response avoids Nginx's built-in 410 HTML body.
    return 410 $wotcv_minimal_empty_manifest;
}

location = /sitemap.xml {
    include /etc/nginx/snippets/wotcv-minimal-noindex-headers.conf;
    types { }
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    set $wotcv_minimal_empty_manifest "";
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 410 $wotcv_minimal_empty_manifest;
}
