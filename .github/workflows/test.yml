name: Tests

on:
  push:
    branches:
      - master
      - feat/wotcv-minimal-*
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned so a run never depends on the runner's default zone. The suites are
# timezone-independent (verified across UTC, US, EU, IN and NZ zones); this keeps
# an accidental system-zone dependency from passing here and failing elsewhere.
env:
  TZ: UTC

jobs:
  docs:
    name: Docs and agent HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Lint integration guides
        working-directory: docs
        run: npm run lint:guides

      - name: Run agent-readiness tests
        working-directory: docs
        run: npm run test:agent-readiness

      - name: Build docs
        working-directory: docs
        run: npm run build

      - name: Verify production HTTP behavior
        working-directory: docs
        run: npm run test:agent-http

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install server dependencies
        run: pnpm --filter rybbit-backend... install --frozen-lockfile

      - name: Build server and shared
        run: pnpm build:server

      - name: Run server tests
        run: pnpm --filter rybbit-backend test:run

      - name: Check isolated operations fixtures
        run: node --test scripts/*.test.mjs

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Pinned upstream baseline is required by the lint delta.

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm --filter client... install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @rybbit/shared build

      - name: Run client tests
        run: pnpm --filter client test:run

      - name: Reject new client lint errors against pinned upstream
        run: node scripts/lint-minimal-delta.cjs

      - name: Build client
        run: pnpm --filter client build
