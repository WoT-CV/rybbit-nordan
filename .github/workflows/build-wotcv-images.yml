name: Build WoT-CV Images

on:
  push:
    branches: [master, feat/wotcv]
  pull_request:
    branches: [master, feat/wotcv]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wotcv-images-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  BACKEND_IMAGE: ghcr.io/wot-cv/rybbit-wotcv-backend
  CLIENT_IMAGE: ghcr.io/wot-cv/rybbit-wotcv-client
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment persistence guards
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          for script in \
            scripts/lib/wotcv-common.sh \
            scripts/lib/wotcv-auth-cutover.sh \
            scripts/wotcv-branch-build-deploy.sh \
            scripts/wotcv-deploy.sh \
            scripts/wotcv-identity-v2-preflight.sh \
            scripts/update_rybbit_wotcv.sh; do
            bash -n "$script"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @rybbit/shared build
      - name: Verify operational and client quality contracts
        run: node --test scripts/tests/*.test.mjs
      - name: Verify generated tracker artifacts
        working-directory: server
        run: pnpm test:run --maxWorkers=4 --minWorkers=1 && pnpm db:check && pnpm build && pnpm check:analytics
      - name: Verify WoT-CV client code
        working-directory: client
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
        run: pnpm test:run --maxWorkers=4 && pnpm lint:wotcv && pnpm knip && pnpm audit:polish && pnpm format:check:wotcv && pnpm typecheck && pnpm build
      - name: Verify both WoT-CV Compose configurations
        env:
          BASE_URL: https://tracking.example.com
          BETTER_AUTH_SECRET: compose-validation-only
          COMPOSE_PROJECT_NAME: rybbit
          DEPLOYMENT: self-hosted
          DISABLE_SIGNUP: "true"
          DISABLE_TELEMETRY: "true"
          IMAGE_TAG: sha-${{ github.sha }}
          LITE_DASHBOARD: "false"
          WOTCV_BUILD_TIME: "1970-01-01T00:00:00Z"
          WOTCV_GIT_SHA: ${{ github.sha }}
        run: |
          source scripts/lib/wotcv-common.sh
          for mode in image branch-build; do
            compose=(docker compose -f docker-compose.yml -f docker-compose.wotcv.yml)
            if [[ "$mode" == branch-build ]]; then
              compose+=(-f docker-compose.wotcv.branch-build.yml)
            fi
            "${compose[@]}" config --format json > "${RUNNER_TEMP}/wotcv-compose.json"
            wotcv_validate_compose_ports "${RUNNER_TEMP}/wotcv-compose.json"
            wotcv_validate_compose_logging "${RUNNER_TEMP}/wotcv-compose.json"
            python3 scripts/lib/wotcv_persistence.py validate-config \
              --config "${RUNNER_TEMP}/wotcv-compose.json" \
              --expected-project rybbit \
              --clickhouse-volume rybbit_clickhouse-data \
              --postgres-volume rybbit_postgres-data \
              --redis-volume rybbit_redis-data
          done

  backend:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            WOTCV_GIT_SHA=${{ github.sha }}
            WOTCV_IMAGE_TAG=${{ env.IMAGE_TAG }}
            WOTCV_BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
      - name: Publish backend digest
        run: |
          echo "### Backend image" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Digest: `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

  client:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.CLIENT_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.WOTCV_BASE_URL }}
            WOTCV_GIT_SHA=${{ github.sha }}
            WOTCV_IMAGE_TAG=${{ env.IMAGE_TAG }}
            WOTCV_BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
      - name: Publish client digest
        run: |
          echo "### Client image" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.CLIENT_IMAGE }}:${{ env.IMAGE_TAG }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Digest: `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
